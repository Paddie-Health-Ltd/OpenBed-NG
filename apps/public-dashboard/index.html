<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No indexing. The kickoff forbids a public API, a sitemap, and any bulk
         export: named wards' duty numbers are an obvious prank-call and
         harassment vector. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>OpenBed</title>
    <!-- The call link's tap target: at least 44 x 44 CSS px (R-2026-09-23-66 C1).
         The app's first style, kept here and minimal; the tile is Bundle 4's. -->
    <style>
      a.call { display: inline-block; min-height: 44px; min-width: 44px; line-height: 44px; padding: 0 12px; }
      /* Age (R-2026-09-23-67 A2, A5): de-emphasis only. The words on each line carry the
         band; nothing here is the only signal of anything. */
      li.age-aged, li.age-none, li.age-unknown, li.age-not-offered { opacity: 0.8; }
      .snapshot-banner { font-weight: bold; border: 2px solid; padding: 8px; }
    </style>
  </head>
  <body>
    <!-- PERMANENT EMERGENCY STRIP. On every page, always. In an emergency nobody
         reads, so the app must always carry a safe fallback path. -->
    <div id="emergency-strip">
      Emergency: <a href="tel:112">112</a> / <a href="tel:767">767</a> — LASAMBUS
    </div>

    <!-- PERSISTENT, NON-DISMISSIBLE. Not a footer. -->
    <div id="indicative-banner">
      Indicative only — call the facility before you travel.
    </div>

    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
