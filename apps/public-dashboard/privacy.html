<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OpenBed privacy notice</title>
    <link rel="icon" type="image/svg+xml" href="../../packages/design/openbed-mark.svg" />
    <!-- THE PRIVACY NOTICE (R-2026-09-26-136 DL-1 b). A second static entry of this app,
         served at /privacy. NO SCRIPT on this page: the notice is written into it at
         build time by vite.config.ts from docs/legal/privacy-notice-v1.0.md, with every
         openbed.ng address read from packages/origins/contacts.json. Its styles are a
         same-origin stylesheet, because the CSP in public/_headers allows style-src
         'self' only. -->
    <link rel="stylesheet" href="./src/privacy.css" />
  </head>
  <body>
    <!-- PERMANENT EMERGENCY STRIP. On every page, always. -->
    <div id="emergency-strip">
      Emergency: <a href="tel:112">112</a> / <a href="tel:767">767</a> — LASAMBUS
    </div>

    <header class="site-header">
      <div class="site-header-inner">
        <img class="mark" src="../../packages/design/openbed-mark.svg" width="28" height="28" alt="" />
        <span class="lockup"><span class="lockup-open">Open</span><span class="lockup-bed">Bed</span></span>
      </div>
    </header>

    <main id="notice">
      <!-- @PRIVACY_NOTICE@ -->
    </main>
  </body>
</html>
