<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The robots tag is written at build time from the one search setting in
         packages/origins/src/search.ts, which ships as public: index, follow.
         The kickoff forbids a public API, a sitemap, and any bulk export: named wards'
         duty numbers are an obvious prank-call and harassment vector. -->
    <!-- @ROBOTS_META@ -->
    <title>OpenBed</title>
    <!-- The mark as the favicon (the design pass, D1). Vite emits it as a hashed
         same-origin asset; public/favicon.ico answers /favicon.ico for clients that
         ask for it anyway, so that path is never the SPA's HTML (R-2026-09-26-122 CX-3). -->
    <link rel="icon" type="image/svg+xml" href="../../packages/design/openbed-mark.svg" />
    <!-- The app's styles are in src/style.css, imported by src/main.ts, so Vite emits
         them as a same-origin asset: this page's CSP allows style-src 'self' only, and
         an inline <style> would be blocked silently (R-2026-09-24-93 BU-2 c). -->
  </head>
  <body>
    <!-- PERMANENT EMERGENCY STRIP. On every page, always. In an emergency nobody
         reads, so the app must always carry a safe fallback path. -->
    <div id="emergency-strip">
      Emergency: <a href="tel:112">112</a> / <a href="tel:767">767</a> — LASAMBUS
    </div>

    <!-- PERSISTENT, NON-DISMISSIBLE. Not a footer. -->
    <div id="indicative-banner">
      Indicative only — call the facility before you travel.
    </div>

    <!-- The lockup is live text, never outlined: "Open" and "Bed" beside the 28 px mark.
         The mark is decorative here (the words name the site), so its alt is empty.
         Mark and lockup are one link home, named "OpenBed home", with a relative "/" so it
         works on the deployment host and on openbed.ng alike (R-2026-09-28-159 EI). -->
    <header class="site-header">
      <div class="site-header-inner">
        <a class="home-link" href="/" aria-label="OpenBed home">
          <img class="mark" src="../../packages/design/openbed-mark.svg" width="28" height="28" alt="" />
          <span class="lockup"><span class="lockup-open">Open</span><span class="lockup-bed">Bed</span></span>
        </a>
      </div>
    </header>

    <main id="app"></main>

    <!-- The general-enquiries address and nothing else, filled by src/main.ts from
         packages/origins/contacts.json so the address is never typed twice. -->
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
